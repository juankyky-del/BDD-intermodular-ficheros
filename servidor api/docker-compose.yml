version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: empresa_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: empresa_core
    ports:
      - "3307:3306"
    volumes:
      - ./Core.sql:/docker-entrypoint-initdb.d/initCore.sql
      - db_data:/var/lib/mysql

  api:
    build: .
    container_name: empresa_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  db_data: